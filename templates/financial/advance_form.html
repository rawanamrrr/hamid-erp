{% extends 'base.html' %}
{% block title %}سلفة جديدة{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto py-8 px-4">
    <h1 class="text-2xl font-black text-gray-800 mb-6"><i class="fas fa-hand-holding-usd text-amber-500 me-2"></i>تسجيل سلفة موظف</h1>
    <form method="post" class="bg-white rounded-2xl border p-6 space-y-4">{% csrf_token %}
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">الموظف</label>
            <select name="employee" required class="w-full p-2.5 border rounded-lg">
                {% for e in employees %}<option value="{{ e.id }}">{{ e.get_full_name|default:e.username }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">قيمة السلفة</label>
            <input name="amount" type="number" step="0.01" min="0" required class="w-full p-2.5 border rounded-lg">
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">القسط الشهري</label>
            <input name="per_period_deduction" type="number" step="0.01" min="0" value="0" class="w-full p-2.5 border rounded-lg">
            <p class="text-xs text-gray-400 mt-1">0 = خصم كامل المبلغ من أول راتب.</p>
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">ملاحظات</label>
            <textarea name="notes" rows="2" class="w-full p-2.5 border rounded-lg"></textarea>
        </div>
        <div class="flex justify-end gap-2">
            <a href="{% url 'financial:advance_list' %}" class="px-4 py-2 bg-gray-100 rounded-xl font-bold text-gray-600">إلغاء</a>
            <button class="px-6 py-2 bg-amber-500 text-white rounded-xl font-bold">حفظ السلفة</button>
        </div>
    </form>
</div>
{% endblock %}
