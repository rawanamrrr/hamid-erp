<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الرمز - {{ sys_settings.shop_name|default:"Wholesale POS System" }}</title>
    <script src="/static/vendor/js/tailwind.js"></script>
    <link href="/static/vendor/fonts/cairo.css" rel="stylesheet">
    <style>body{font-family:'Cairo',sans-serif;background:#f8fafc}
        input{width:100%;padding:14px 16px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;font-family:'Cairo';font-weight:600;color:#0f172a;outline:none;direction:ltr;text-align:left}
        input:focus{background:#fff;border-color:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.1)}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-[420px]">
        <div class="bg-white rounded-[2rem] shadow-2xl border border-slate-100 overflow-hidden">
            <div class="h-2 bg-gradient-to-r from-red-600 to-slate-900"></div>
            <div class="p-8">
                <h1 class="text-2xl font-black text-slate-900 mb-1">تعيين كلمة مرور جديدة</h1>
                <p class="text-sm text-slate-500 mb-6 font-bold">أدخل الرمز المرسل إلى {{ email }} وكلمة المرور الجديدة.</p>

                {% for m in messages %}
                <div class="mb-4 p-3 rounded-xl text-sm font-bold {% if m.tags == 'success' %}bg-green-50 text-green-700 border border-green-200{% else %}bg-red-50 text-red-600 border border-red-200{% endif %}">{{ m }}</div>
                {% endfor %}

                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">رمز التحقق</label>
                        <input type="text" name="code" inputmode="numeric" maxlength="6" placeholder="______" required autofocus>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">كلمة المرور الجديدة</label>
                        <input type="password" name="new_password" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">تأكيد كلمة المرور</label>
                        <input type="password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-slate-900 hover:bg-red-600 text-white text-lg font-black rounded-xl shadow-lg transition">تغيير كلمة المرور</button>
                </form>
                <a href="{% url 'forgot_password' %}" class="block text-center mt-5 text-sm font-bold text-slate-500 hover:text-slate-700">طلب رمز جديد</a>
            </div>
        </div>
    </div>
</body>
</html>
