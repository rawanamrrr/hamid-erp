{% extends 'base.html' %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-gray-200 p-8 text-center">
        
        <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">هل أنت متأكد؟</h2>
        
        <p class="text-gray-500 mb-8">
            أنت على وشك حذف 
            <span class="font-bold text-gray-800">"{{ product.name|default:object.name|default:'هذا العنصر' }}"</span>.
            <br>
            لا يمكن التراجع عن هذه العملية بعد إتمامها.
        </p>

        <form method="post" class="flex flex-col gap-3">
            {% csrf_token %}
            <button type="submit" class="w-full py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium shadow-sm transition">
                نعم، قم بالحذف
            </button>
            
            <!-- زر العودة يعود للصفحة السابقة أو للقائمة الرئيسية حسب السياق -->
            <a href="javascript:history.back()" class="w-full py-3 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium transition">
                إلغاء
            </a>
        </form>
    </div>
</div>
{% endblock %}
