<!-- Quick Add Unit Modal -->
<div id="quickUnitModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[210] hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-indigo-600 px-5 py-3.5 flex justify-between items-center text-white">
            <h3 class="font-bold text-base flex items-center gap-2">
                <i class="fas fa-plus-circle text-indigo-200"></i> إضافة وحدة قياس جديدة
            </h3>
            <button onclick="closeQuickUnitModal()" class="text-white/70 hover:text-white transition text-xl leading-none">&times;</button>
        </div>
        <form id="quickUnitForm" onsubmit="event.preventDefault(); submitQuickUnit();" class="p-5 space-y-3 text-right" dir="rtl">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">اسم الوحدة <span class="text-red-500">*</span></label>
                <input type="text" id="unitName" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-3 outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-semibold text-sm" placeholder="مثال: قطعة">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">الرمز (اختياري)</label>
                <input type="text" id="unitAbbr" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-3 outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-semibold text-sm" placeholder="مثال: PCS">
            </div>
            <div class="pt-3 border-t border-gray-100 flex gap-2 justify-end">
                <button type="button" onclick="closeQuickUnitModal()" class="px-4 py-2 border border-gray-200 text-gray-600 rounded-xl hover:bg-gray-50 transition font-bold text-sm">إلغاء</button>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition font-bold text-sm">حفظ</button>
            </div>
        </form>
    </div>
</div>
