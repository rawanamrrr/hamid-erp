<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ في الخادم (500) | النظام</title>
    <script src="/static/vendor/js/tailwind.js"></script>
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <style>
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .pulse-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.2);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans selection:bg-red-200">
    <!-- Geometric Background Pattern -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#ef4444 1px, transparent 1px); background-size: 30px 30px;"></div>

    <div class="z-10 bg-white p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center border-t-8 border-red-500 transform transition-all hover:scale-105 duration-500">
        <div class="relative w-32 h-32 mx-auto mb-8 flex items-center justify-center">
            <div class="pulse-circle w-full h-full"></div>
            <div class="pulse-circle w-full h-full" style="animation-delay: 1s;"></div>
            <div class="relative z-10 w-24 h-24 bg-red-100 rounded-full flex items-center justify-center animate-float shadow-lg border-4 border-white">
                <i class="fas fa-server text-4xl text-red-500"></i>
            </div>
            <!-- Sparks/broken bits -->
            <i class="fas fa-bolt absolute top-0 right-0 text-yellow-400 text-xl animate-bounce"></i>
            <i class="fas fa-cog absolute bottom-0 left-0 text-gray-400 text-lg animate-spin" style="animation-duration: 3s;"></i>
        </div>

        <h1 class="text-6xl font-extrabold text-gray-900 mb-2 tracking-tight">500</h1>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">عذرًا، حدث خطأ في الخادم</h2>
        <p class="text-gray-500 mb-8 leading-relaxed">
            عذراً، يبدو أن هناك مشكلة تقنية ناتجة من الخادم أثناء محاولة معالجة طلبك.<br>
            فريق الدعم الفني تم إبلاغه بالمشكلة.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <a href="/" class="px-6 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition shadow-lg shadow-red-200 flex items-center gap-2 transform hover:-translate-y-1 w-full sm:w-auto justify-center">
                <i class="fas fa-home"></i> العودة للرئيسية
            </a>
            <button onclick="window.location.reload()" class="px-6 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition shadow-sm border border-gray-200 flex items-center gap-2 transform hover:-translate-y-1 w-full sm:w-auto justify-center group">
                <i class="fas fa-sync-alt group-hover:rotate-180 transition-transform duration-500"></i> إعادة المحاولة
            </button>
        </div>
    </div>
</body>
</html>
