{% extends 'base.html' %}
{% block title %}ميزة مقفلة{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-16 px-4 text-center font-arabic" dir="rtl">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-50 flex items-center justify-center mb-5">
        <i class="fas fa-lock text-amber-400 text-2xl"></i>
    </div>
    <h1 class="text-xl font-black text-gray-900 mb-2">هذه الميزة غير مفعّلة</h1>
    <p class="text-sm text-gray-500 leading-relaxed mb-1">
        ميزة «{{ module_label }}» غير مُفعّلة على هذا النظام.
    </p>
    <p class="text-xs text-gray-400 mb-6">
        لتفعيلها، يرجى التواصل مع المطوّر للحصول على رمز التفعيل الخاص بها.
    </p>
    <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-bold">
        <i class="fas fa-arrow-right text-xs"></i> العودة للرئيسية
    </a>
</div>
{% endblock %}
