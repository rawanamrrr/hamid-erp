<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أدوات المطور</title>
    <link href="/static/vendor/css/tailwind2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="login-gradient min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-indigo-600 to-indigo-700 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-key text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-800 mb-2">تسجيل دخول المطور</h1>
                <p class="text-gray-500 text-sm">أدخل بيانات حساب المطور للوصول إلى لوحة التحكم</p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl flex items-center gap-3 animate-fade-in">
                <i class="fas fa-exclamation-circle text-red-500 text-lg"></i>
                <div>
                    <div class="font-bold text-red-700 text-sm">فشل تسجيل الدخول</div>
                    <div class="text-red-600 text-xs">{{ error }}</div>
                </div>
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm" for="username">
                        اسم المستخدم
                    </label>
                    <div class="relative">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="fas fa-user"></i>
                        </span>
                        <input 
                            id="username" 
                            name="username" 
                            type="text" 
                            required
                            class="w-full pr-10 pl-4 py-3 border-2 border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 bg-gray-50 transition-all"
                            placeholder="اسم المستخدم"
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm" for="password">
                        كلمة المرور
                    </label>
                    <div class="relative">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            required
                            class="w-full pr-10 pl-4 py-3 border-2 border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 bg-gray-50 transition-all"
                            placeholder="••••••••"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 hover:shadow-xl hover:-translate-y-1 transition-all flex items-center justify-center gap-2"
                >
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500">
                <p class="mb-1">⚠️ للحفاظ على الأمان، لا تشارك معلومات الحساب مع أي شخص!</p>
                <p class="opacity-70">الحساب الافتراضي: اسم المستخدم = dev | كلمة المرور = admin123</p>
            </div>
        </div>
    </div>
</body>
</html>
